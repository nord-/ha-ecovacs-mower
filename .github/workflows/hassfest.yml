name: Validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # brands requires an icon in home-assistant/brands, which is only needed
          # for listing in the HACS default store. This integration is installed
          # as a custom repository, so the check can never go green and would keep
          # the job permanently red. Remove this line the day the brands PR has
          # landed and the default store becomes relevant.
          ignore: brands
