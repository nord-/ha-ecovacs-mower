name: Validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # brands kräver en ikon i home-assistant/brands, vilket bara behövs
          # för listning i HACS default-store. Integrationen installeras som
          # custom repository, så kontrollen kan aldrig bli grön och skulle
          # göra jobbet permanent rött. Ta bort raden den dag brands-PR:en är
          # inne och default-store blir aktuellt.
          ignore: brands
